<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#162240"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Background - dark navy rectangle with rounded corners -->
  <rect width="800" height="300" fill="url(#bgGrad)" rx="20"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="75" x2="400" y2="75"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="225" x2="400" y2="225"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
  </g>

  <!-- ==================== LEFT SIDE: ICON ==================== -->
  <g transform="translate(130, 150)">
    <!-- Radar scan ring -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#1e3a5f" stroke-width="2"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#1e3a5f" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1e3a5f" stroke-width="1"/>

    <!-- Radar scan wedge -->
    <path d="M0,0 L0,-95 A95,95 0 0,1 80.6,-50.3 Z" fill="url(#accentGrad)" opacity="0.12">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </path>
    <line x1="0" y1="0" x2="0" y2="-95" stroke="#06b6d4" stroke-width="2" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </line>

    <!-- Scan dots -->
    <circle cx="0" cy="-52" r="3" fill="#06b6d4" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="-25" r="2.5" fill="#3b82f6" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="30" r="2.5" fill="#a855f7" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="55" r="3" fill="#7c3aed" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-30" cy="40" r="2" fill="#06b6d4" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-40" cy="-20" r="2" fill="#3b82f6" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="2.1s" repeatCount="indefinite"/>
    </circle>

    <!-- Central brain/eye circle -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="22" fill="#1a2d55" stroke="url(#purpleGrad)" stroke-width="2.5"/>

    <!-- Neural network lines inside -->
    <g stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M-10,-8 Q0,-15 10,-8"/>
      <path d="M-9,-3 Q0,-10 9,-3"/>
      <path d="M-8,2 Q0,-5 8,2"/>
      <path d="M-7,7 Q0,0 7,7"/>
    </g>
    <!-- Sync line -->
    <path d="M-8,-12 Q0,-18 8,-12" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M-6,12 Q0,18 6,12" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Neural nodes -->
    <g fill="#06b6d4">
      <circle cx="0" cy="-12" r="2.5"/>
      <circle cx="-10" cy="-3" r="2"/>
      <circle cx="10" cy="-3" r="2"/>
      <circle cx="-9" cy="7" r="2"/>
      <circle cx="9" cy="7" r="2"/>
      <circle cx="0" cy="13" r="2.5"/>
    </g>

    <!-- Pulse anims -->
    <circle cx="10" cy="-3" r="1" fill="#a855f7">
      <animate attributeName="r" values="1;4;1" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-12" r="1" fill="#3b82f6">
      <animate attributeName="r" values="1;4;1" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Center crosshair -->
    <circle cx="0" cy="0" r="3" fill="#06b6d4"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#06b6d4" stroke-width="1" opacity="0.7"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#06b6d4" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- Separator line -->
  <line x1="270" y1="40" x2="270" y2="260" stroke="#1e3a5f" stroke-width="1" opacity="0.8"/>

  <!-- ==================== RIGHT SIDE: TEXT ==================== -->
  <g transform="translate(310, 0)">
    <!-- "AGENT" -->
    <text x="0" y="125" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="8" fill="url(#titleGrad)">AGENT</text>

    <!-- "INTEL" -->
    <text x="0" y="190" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="8" fill="url(#accentGrad)">INTEL</text>

    <!-- Subtitle -->
    <text x="0" y="220" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#4f6f8f">AI AGENT INTELLIGENCE COLLECTOR</text>

    <!-- Badges row -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="72" height="20" rx="4" fill="#1e3a5f"/>
      <text x="36" y="14" text-anchor="middle" fill="#06b6d4" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="1">ANYSEARCH</text>

      <rect x="80" y="0" width="62" height="20" rx="4" fill="#1e3a5f"/>
      <text x="111" y="14" text-anchor="middle" fill="#a855f7" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="1">OPENCLAW</text>

      <rect x="150" y="0" width="34" height="20" rx="4" fill="#1e3a5f"/>
      <text x="167" y="14" text-anchor="middle" fill="#3b82f6" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="1">CLI</text>
    </g>
  </g>

  <!-- Bottom right meta -->
  <text x="780" y="280" text-anchor="end" fill="#1e3a5f" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" letter-spacing="2">v1.0 · MIT</text>
</svg>
