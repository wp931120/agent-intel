<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <!-- Solid dark background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Bright cyan-blue accent -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Bright purple -->
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <!-- White text -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <!-- Accent text -->
    <linearGradient id="intelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Background - solid dark -->
  <rect width="800" height="300" fill="url(#bgGrad)" rx="24"/>

  <!-- Subtle grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.8">
    <line x1="0" y1="75" x2="400" y2="75"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="225" x2="400" y2="225"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
  </g>

  <!-- Border glow -->
  <rect x="4" y="4" width="792" height="292" rx="20" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.15"/>

  <!-- ==================== ICON ==================== -->
  <g transform="translate(140, 150)">
    <!-- Outer radar rings -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Radar scan wedge -->
    <path d="M0,0 L0,-95 A95,95 0 0,1 80.6,-50.3 Z" fill="url(#accentGrad)" opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- Radar beam -->
    <line x1="0" y1="0" x2="0" y2="-95" stroke="#22d3ee" stroke-width="2" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
    </line>

    <!-- Scan dots -->
    <circle cx="0" cy="-52" r="3.5" fill="#22d3ee">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="-25" r="3" fill="#3b82f6">
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="62" cy="35" r="3" fill="#a855f7">
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="58" r="3.5" fill="#c084fc">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-32" cy="42" r="2.5" fill="#22d3ee">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-42" cy="-22" r="2.5" fill="#3b82f6">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.1s" repeatCount="indefinite"/>
    </circle>

    <!-- Central brain circle frame -->
    <circle cx="0" cy="0" r="35" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="25" fill="#0f172a" stroke="url(#purpleGrad)" stroke-width="2.5"/>

    <!-- Neural lines -->
    <g stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" fill="none">
      <path d="M-12,-8 Q0,-18 12,-8"/>
      <path d="M-11,-1 Q0,-11 11,-1"/>
      <path d="M-10,5 Q0,-5 10,5"/>
      <path d="M-9,11 Q0,1 9,11"/>
    </g>
    <path d="M-8,-14 Q0,-22 8,-14" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M-7,16 Q0,24 7,16" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Neural nodes -->
    <g fill="#22d3ee">
      <circle cx="0" cy="-14" r="3"/>
      <circle cx="-12" cy="-2" r="2.5"/>
      <circle cx="12" cy="-2" r="2.5"/>
      <circle cx="-11" cy="9" r="2.5"/>
      <circle cx="11" cy="9" r="2.5"/>
      <circle cx="0" cy="16" r="3"/>
    </g>

    <!-- Pulse animations -->
    <circle cx="12" cy="-2" r="1.5" fill="#a855f7">
      <animate attributeName="r" values="1.5;5;1.5" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-14" r="1.5" fill="#3b82f6">
      <animate attributeName="r" values="1.5;5;1.5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-11" cy="9" r="1.5" fill="#22d3ee">
      <animate attributeName="r" values="1.5;5;1.5" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.1s" repeatCount="indefinite"/>
    </circle>

    <!-- Center crosshair -->
    <circle cx="0" cy="0" r="4" fill="#22d3ee"/>
    <line x1="0" y1="-9" x2="0" y2="9" stroke="#22d3ee" stroke-width="1.2"/>
    <line x1="-9" y1="0" x2="9" y2="0" stroke="#22d3ee" stroke-width="1.2"/>
  </g>

  <!-- Divider -->
  <line x1="280" y1="40" x2="280" y2="260" stroke="#1e293b" stroke-width="2"/>

  <!-- ==================== TEXT ==================== -->
  <g transform="translate(320, 0)">
    <!-- AGENT - white -->
    <text x="0" y="120" font-family="'Inter','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="56" font-weight="800" letter-spacing="10" fill="url(#titleGrad)">AGENT</text>

    <!-- INTEL - bright cyan -->
    <text x="0" y="185" font-family="'Inter','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="56" font-weight="800" letter-spacing="10" fill="url(#intelGrad)">INTEL</text>

    <!-- Tagline -->
    <text x="0" y="218" font-family="'Inter','SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="4" fill="#475569">AI AGENT INTELLIGENCE COLLECTOR</text>

    <!-- Badges -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="75" height="24" rx="4" fill="#1e293b"/>
      <text x="37" y="16" text-anchor="middle" fill="#22d3ee" font-family="'Inter','SF Pro Display',sans-serif" font-size="10" font-weight="700" letter-spacing="1">ANYSEARCH</text>

      <rect x="84" y="0" width="65" height="24" rx="4" fill="#1e293b"/>
      <text x="116" y="16" text-anchor="middle" fill="#c084fc" font-family="'Inter','SF Pro Display',sans-serif" font-size="10" font-weight="700" letter-spacing="1">OPENCLAW</text>

      <rect x="158" y="0" width="38" height="24" rx="4" fill="#1e293b"/>
      <text x="177" y="16" text-anchor="middle" fill="#3b82f6" font-family="'Inter','SF Pro Display',sans-serif" font-size="10" font-weight="700" letter-spacing="1">CLI</text>
    </g>
  </g>

  <!-- Version -->
  <text x="780" y="280" text-anchor="end" fill="#1e293b" font-family="'Inter','SF Pro Display',sans-serif" font-size="11" letter-spacing="2">v1.0 · MIT</text>
</svg>
