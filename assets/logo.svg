<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141b33"/>
    </linearGradient>
    <linearGradient id="radarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0088ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="32"/>

  <!-- Outer glow ring -->
  <circle cx="200" cy="200" r="145" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.08"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.12"/>

  <!-- Radar scan arc -->
  <path d="M200,200 L200,75 A125,125 0 0,1 316.4,140.6 Z" fill="url(#glowGrad)" opacity="0.12">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Radar line -->
  <line x1="200" y1="200" x2="200" y2="75" stroke="#00d4ff" stroke-width="1.5" opacity="0.3" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Radar circles -->
  <circle cx="200" cy="200" r="50" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.15"/>
  <circle cx="200" cy="200" r="85" fill="none" stroke="#00d4ff" stroke-width="0.6" opacity="0.12"/>
  <circle cx="200" cy="200" r="115" fill="none" stroke="#00d4ff" stroke-width="0.4" opacity="0.1"/>

  <!-- Scan dots -->
  <circle cx="200" cy="138" r="2" fill="#00d4ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="160" r="1.5" fill="#00d4ff" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="275" cy="230" r="1.5" fill="#7c3aed" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="270" r="2" fill="#7c3aed" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="265" r="1" fill="#06b6d4" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="175" r="1.5" fill="#00d4ff" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.1;0.35" dur="1.7s" repeatCount="indefinite"/>
  </circle>

  <!-- Central circle -->
  <circle cx="200" cy="200" r="45" fill="none" stroke="url(#radarGrad)" stroke-width="2" opacity="0.3"/>
  <circle cx="200" cy="200" r="38" fill="none" stroke="url(#radarGrad)" stroke-width="1.5" opacity="0.2"/>

  <!-- Agent Intel icon: brain + radar eye -->
  <!-- Outer ring segments (radar feel) -->
  <g filter="url(#glow)">
    <!-- Top arc -->
    <path d="M200,162 A38,38 0 0,1 233.8,172" fill="none" stroke="#00d4ff" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <path d="M233.8,172 A38,38 0 0,1 238,200" fill="none" stroke="#00d4ff" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>

    <!-- Right arc -->
    <path d="M238,200 A38,38 0 0,1 226,231" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <path d="M226,231 A38,38 0 0,1 200,238" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" opacity="0.3"/>

    <!-- Bottom arc -->
    <path d="M200,238 A38,38 0 0,1 170,228" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
    <path d="M170,228 A38,38 0 0,1 162,200" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" opacity="0.25"/>

    <!-- Left arc -->
    <path d="M162,200 A38,38 0 0,1 172,175" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" opacity="0.3"/>
    <path d="M172,175 A38,38 0 0,1 200,162" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" opacity="0.2"/>
  </g>

  <!-- Central eye/pupil with brain pattern -->
  <circle cx="200" cy="200" r="22" fill="none" stroke="url(#brainGrad)" stroke-width="2.5" filter="url(#glow)" opacity="0.9"/>

  <!-- Neural/brain lines inside -->
  <g stroke="url(#brainGrad)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M190,195 Q200,188 210,195"/>
    <path d="M190,200 Q200,193 210,200"/>
    <path d="M190,205 Q200,198 210,205"/>
    <path d="M195,190 Q200,185 205,190"/>
    <path d="M195,210 Q200,215 205,210"/>
  </g>

  <!-- Neural nodes -->
  <g fill="#00d4ff" opacity="0.9">
    <circle cx="200" cy="185" r="2.5"/>
    <circle cx="185" cy="195" r="2"/>
    <circle cx="215" cy="195" r="2"/>
    <circle cx="185" cy="205" r="2"/>
    <circle cx="215" cy="205" r="2"/>
    <circle cx="200" cy="215" r="2.5"/>
  </g>

  <!-- Neural connection pulses -->
  <circle cx="215" cy="195" r="1" fill="#7c3aed" opacity="0.8">
    <animate attributeName="r" values="1;3;1" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="185" cy="205" r="1" fill="#7c3aed" opacity="0.8">
    <animate attributeName="r" values="1;3;1" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="185" r="1" fill="#06b6d4" opacity="0.8">
    <animate attributeName="r" values="1;3;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Crosshair center -->
  <circle cx="200" cy="200" r="3" fill="#00d4ff" opacity="0.9" filter="url(#innerGlow)"/>
  <line x1="200" y1="193" x2="200" y2="207" stroke="#00d4ff" stroke-width="0.8" opacity="0.6"/>
  <line x1="193" y1="200" x2="207" y2="200" stroke="#00d4ff" stroke-width="0.8" opacity="0.6"/>

  <!-- Corner bracket decorations -->
  <g stroke="#00d4ff" stroke-width="1.2" opacity="0.15" fill="none">
    <!-- Top-left -->
    <path d="M60,80 L60,60 L80,60"/>
    <path d="M50,50 L50,40 L40,40"/>
    <!-- Top-right -->
    <path d="M340,80 L340,60 L320,60"/>
    <path d="M350,50 L350,40 L360,40"/>
    <!-- Bottom-left -->
    <path d="M60,320 L60,340 L80,340"/>
    <path d="M50,350 L50,360 L40,360"/>
    <!-- Bottom-right -->
    <path d="M340,320 L340,340 L320,340"/>
    <path d="M350,350 L350,360 L360,360"/>
  </g>

  <!-- Label "AGENT" top -->
  <text x="200" y="285" text-anchor="middle" fill="#00d4ff" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="8" opacity="0.3">AGENT</text>

  <!-- Label "INTEL" bottom -->
  <text x="200" y="305" text-anchor="middle" fill="#00d4ff" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="8" opacity="0.3">INTEL</text>

  <!-- Version tag -->
  <text x="200" y="370" text-anchor="middle" fill="#00d4ff" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9" letter-spacing="4" opacity="0.12">v1.0</text>
</svg>
