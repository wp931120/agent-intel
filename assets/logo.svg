<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a1028"/>
      <stop offset="100%" stop-color="#0f1735"/>
    </linearGradient>
    <linearGradient id="radarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="40%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0088ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0088ff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)" rx="24"/>

  <!-- Subtle grid pattern -->
  <g stroke="#1e2a5a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>

  <!-- Outer glow rings -->
  <circle cx="200" cy="200" r="155" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.08"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.12"/>

  <!-- Back glow -->
  <circle cx="200" cy="200" r="60" fill="url(#glowGrad2)" filter="url(#strongGlow)" opacity="0.15"/>

  <!-- Radar scan arc -->
  <path d="M200,200 L200,65 A135,135 0 0,1 325.7,132.4 Z" fill="url(#glowGrad)" opacity="0.15">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Radar line -->
  <line x1="200" y1="200" x2="200" y2="65" stroke="#00e5ff" stroke-width="2" opacity="0.4" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Radar concentric rings -->
  <circle cx="200" cy="200" r="55" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.2"/>
  <circle cx="200" cy="200" r="90" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.15"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#00e5ff" stroke-width="0.6" opacity="0.12"/>

  <!-- Scan dots -->
  <circle cx="200" cy="130" r="2.5" fill="#00e5ff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.15;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="268" cy="155" r="2" fill="#00e5ff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="285" cy="238" r="2" fill="#a855f7" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="245" cy="278" r="2.5" fill="#a855f7" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="148" cy="272" r="1.5" fill="#22d3ee" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="135" cy="168" r="2" fill="#00e5ff" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="1.7s" repeatCount="indefinite"/>
  </circle>

  <!-- Central circle frames -->
  <circle cx="200" cy="200" r="48" fill="none" stroke="url(#radarGrad)" stroke-width="2" opacity="0.35"/>
  <circle cx="200" cy="200" r="42" fill="none" stroke="url(#radarGrad)" stroke-width="1.5" opacity="0.25"/>

  <!-- Radar arc segments -->
  <g filter="url(#glow)">
    <path d="M200,158 A42,42 0 0,1 237.6,169" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M237.6,169 A42,42 0 0,1 242,200" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M242,200 A42,42 0 0,1 229,234" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M229,234 A42,42 0 0,1 200,242" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    <path d="M200,242 A42,42 0 0,1 168,231" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
    <path d="M168,231 A42,42 0 0,1 158,200" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
    <path d="M158,200 A42,42 0 0,1 169,172" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    <path d="M169,172 A42,42 0 0,1 200,158" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
  </g>

  <!-- Brain neural network circle -->
  <circle cx="200" cy="200" r="24" fill="none" stroke="url(#brainGrad)" stroke-width="3" filter="url(#glow)" opacity="1"/>

  <!-- Neural connections inside -->
  <g stroke="url(#brainGrad)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="1">
    <path d="M188,192 Q200,184 212,192"/>
    <path d="M189,198 Q200,190 211,198"/>
    <path d="M190,204 Q200,196 210,204"/>
    <path d="M191,210 Q200,202 209,210"/>
    <path d="M195,186 Q200,180 205,186"/>
    <path d="M195,214 Q200,220 205,214"/>
  </g>

  <!-- Neural nodes - bright -->
  <g fill="#00e5ff" filter="url(#innerGlow)">
    <circle cx="200" cy="182" r="3"/>
    <circle cx="183" cy="193" r="2.5"/>
    <circle cx="217" cy="193" r="2.5"/>
    <circle cx="184" cy="207" r="2.5"/>
    <circle cx="216" cy="207" r="2.5"/>
    <circle cx="200" cy="218" r="3"/>
  </g>

  <!-- Neural pulse animations -->
  <circle cx="217" cy="193" r="1.5" fill="#a855f7" opacity="0.9">
    <animate attributeName="r" values="1.5;5;1.5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="183" cy="207" r="1.5" fill="#a855f7" opacity="0.9">
    <animate attributeName="r" values="1.5;5;1.5" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="182" r="1.5" fill="#22d3ee" opacity="0.9">
    <animate attributeName="r" values="1.5;5;1.5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="216" cy="207" r="1.5" fill="#00e5ff" opacity="0.9">
    <animate attributeName="r" values="1.5;5;1.5" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Center crosshair -->
  <circle cx="200" cy="200" r="4" fill="#00e5ff" opacity="1" filter="url(#glow)"/>
  <line x1="200" y1="192" x2="200" y2="208" stroke="#00e5ff" stroke-width="1" opacity="0.8"/>
  <line x1="192" y1="200" x2="208" y2="200" stroke="#00e5ff" stroke-width="1" opacity="0.8"/>

  <!-- Corner brackets -->
  <g stroke="#00e5ff" stroke-width="1.5" opacity="0.25" fill="none">
    <path d="M40,80 L40,40 L80,40"/>
    <path d="M30,30 L30,20 L20,20"/>
    <path d="M760,80 L760,40 L720,40"/>
    <path d="M770,30 L770,20 L780,20"/>
    <path d="M40,320 L40,360 L80,360"/>
    <path d="M30,370 L30,380 L20,380"/>
    <path d="M760,320 L760,360 L720,360"/>
    <path d="M770,370 L770,380 L780,380"/>
  </g>

  <!-- Title "AGENT INTEL" -->
  <text x="350" y="195" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="700" letter-spacing="6" fill="url(#titleGrad)">AGENT INTEL</text>

  <!-- Tagline -->
  <text x="350" y="230" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" letter-spacing="4" fill="url(#subGrad)">AI AGENT INTELLIGENCE COLLECTOR</text>

  <!-- Separator line -->
  <line x1="350" y1="248" x2="520" y2="248" stroke="#1e3a5f" stroke-width="1" opacity="0.6"/>
  <line x1="350" y1="248" x2="380" y2="248" stroke="#00e5ff" stroke-width="1" opacity="0.4"/>

  <!-- Feature badges -->
  <g transform="translate(350, 268)">
    <rect x="0" y="0" width="70" height="22" rx="4" fill="#1e2a5a" opacity="0.6"/>
    <text x="35" y="15" text-anchor="middle" fill="#00e5ff" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="500" letter-spacing="1">ANYSEARCH</text>

    <rect x="80" y="0" width="50" height="22" rx="4" fill="#1e2a5a" opacity="0.6"/>
    <text x="105" y="15" text-anchor="middle" fill="#a855f7" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="500" letter-spacing="1">OPENCLAW</text>

    <rect x="140" y="0" width="36" height="22" rx="4" fill="#1e2a5a" opacity="0.6"/>
    <text x="158" y="15" text-anchor="middle" fill="#22d3ee" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" font-weight="500" letter-spacing="1">CLI</text>
  </g>

  <!-- Bottom corner meta -->
  <text x="760" y="370" text-anchor="end" fill="#1e3a5f" font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" letter-spacing="2" opacity="0.3">v1.0 · MIT</text>

  <!-- Divider line -->
  <line x1="310" y1="60" x2="310" y2="340" stroke="#1e2a5a" stroke-width="1" opacity="0.4"/>
</svg>
